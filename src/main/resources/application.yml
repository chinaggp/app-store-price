server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${APP_STORE_PRICE_DATA_DIR:./data}/app-store-price.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

exchange-rate:
  frankfurter-base-url: https://api.frankfurter.dev/v1

debug:
  trigger-price-snapshot-enabled: ${TRIGGER_PRICE_SNAPSHOT_ENABLED:false}

price-snapshot:
  cron: ${PRICE_SNAPSHOT_CRON:0 0 4 * * ?}
